name: Refresh fetchFromGitHub hashes

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "**/*.nix"

permissions:
  contents: write
  actions: write

concurrency:
  group: fetchgithub-hashes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Refresh annotated source hashes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Run the trusted base-branch script, not code from the PR.
          git show "${BASE_SHA}:.github/scripts/update-fetchgithub-hashes.py" > "${RUNNER_TEMP}/update-fetchgithub-hashes.py"
          python3 "${RUNNER_TEMP}/update-fetchgithub-hashes.py"

      - name: Commit refreshed hashes and build the updated revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet -- '*.nix'; then
            exit 0
          fi
          # Refuse to push if Renovate has moved the branch since this job began.
          remote_sha="$(git ls-remote origin "refs/heads/${PR_BRANCH}" | cut -f1)"
          if [ "${remote_sha}" != "${PR_SHA}" ]; then
            echo "Renovate updated the branch; its next run will refresh the hashes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.nix'
          git commit -m 'Refresh fetchFromGitHub source hashes'
          git push origin "HEAD:refs/heads/${PR_BRANCH}"
          # GITHUB_TOKEN pushes do not trigger pull_request/push workflows.
          # workflow_dispatch does, so build the new commit explicitly.
          gh workflow run build-nixos.yml --ref "${PR_BRANCH}"
