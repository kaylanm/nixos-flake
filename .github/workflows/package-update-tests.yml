name: Package updater tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: |
          nix shell --no-write-lock-file .#package-update-tools --command python3 -m unittest discover -s tests -v
          nix shell --no-write-lock-file .#package-update-tools --command actionlint .github/workflows/package-updates.yml .github/workflows/package-update-tests.yml
      - name: Evaluate update targets
        run: |
          nix eval --raw --no-write-lock-file .#sane-scan-pdf.drvPath
          nix eval --raw --no-write-lock-file .#octoapp.drvPath
