name: Build NixOS configurations

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # GITHUB_TOKEN commits from the lock updater do not trigger push workflows.
  workflow_run:
    workflows: ["Bump flake.lock"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nixos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configurations:
    name: Discover configurations
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - id: matrix
        name: Create build matrix
        run: |
          matrix="$(nix eval --json .#nixosConfigurations --apply '
            configurations:
            {
              configuration = builtins.filter
                (configuration:
                  (builtins.getAttr configuration configurations).pkgs.stdenv.hostPlatform.system
                  == "x86_64-linux")
                (builtins.attrNames configurations);
            }
          ')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.configuration }}
    needs: configurations
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configurations.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Build system closure
        env:
          NIXOS_CONFIGURATION: ${{ matrix.configuration }}
        run: >-
          nix build
          --no-link
          --print-build-logs
          ".#nixosConfigurations.${NIXOS_CONFIGURATION}.config.system.build.toplevel"
