name: Build NixOS configurations

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configurations:
    name: Discover configurations
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@v31

      - id: matrix
        name: Create build matrix
        run: |
          matrix="$(nix eval --json .#nixosConfigurations --apply '
            configurations:
            {
              configuration = builtins.filter
                (configuration:
                  (builtins.getAttr configuration configurations).pkgs.stdenv.hostPlatform.system
                  == "x86_64-linux")
                (builtins.attrNames configurations);
            }
          ')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.configuration }}
    needs: configurations
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configurations.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@v31

      - name: Build system closure
        env:
          NIXOS_CONFIGURATION: ${{ matrix.configuration }}
        run: >-
          nix build
          --no-link
          --print-build-logs
          ".#nixosConfigurations.${NIXOS_CONFIGURATION}.config.system.build.toplevel"
